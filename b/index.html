<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f2a1f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>猟野ノート B</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand"><i aria-hidden="true"></i>猟野ノート<span class="ver">B</span></div>
    <span class="chip season" id="seasonChip">—</span>
    <span class="chip" id="sunChip" title="日の出〜日没(銃猟可能時間)">—</span>
    <span class="chip" id="gpsChip">GPS オフ</span>
    <span class="chip warn" id="netChip" hidden>オフライン</span>
  </header>

  <main class="stage">
    <div id="map" aria-label="地図"></div>
    <div class="stampbar" id="stampBar" role="toolbar" aria-label="スタンプ"></div>
    <div class="zonebanner" id="zoneBanner" role="alert" hidden></div>

    <div class="fabs">
      <button class="fab" id="btnLayers" aria-label="地図の種類" aria-expanded="false">
        <svg viewBox="0 0 24 24"><path d="M12 3 2 8l10 5 10-5-10-5Zm-10 9 10 5 10-5M2 16l10 5 10-5"/></svg>
      </button>
      <button class="fab" id="btnLocate" aria-label="現在地" aria-pressed="false">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v3m0 14v3M2 12h3m14 0h3"/></svg>
      </button>
      <button class="fab primary" id="btnAdd" aria-label="メモつきで記録">
        <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
      </button>
    </div>

    <div class="popover" id="layerMenu" hidden>
      <div class="label">地図</div>
      <label><input type="radio" name="base" value="std" id="base-std"> 標準地図</label>
      <label><input type="radio" name="base" value="pale" id="base-pale"> 淡色地図</label>
      <label><input type="radio" name="base" value="photo" id="base-photo"> 航空写真</label>
      <div class="label">重ねる</div>
      <label><input type="checkbox" id="ovHillshade"> 陰影起伏</label>
      <label><input type="checkbox" id="ovAreas"> 保存済みの範囲</label>
      <label><input type="checkbox" id="ovHmap"> ハンターマップ</label>
      <label><input type="checkbox" id="ovZones"> 登録した区域</label>
    </div>

    <div class="addbar" id="addBar" hidden>
      <div class="addtitle" id="addTitle"></div>
      <div class="addacts">
        <button class="btn ghost" id="addCancel">やめる</button>
        <button class="btn primary" id="addHere">現在地に押す</button>
      </div>
    </div>

    <div class="drawbar" id="drawBar" hidden>
      <div class="drawrow">
        <label for="drawType" class="sr">区域の種類</label>
        <select id="drawType"></select>
        <span class="mono note" id="drawCount">0点</span>
      </div>
      <label for="drawName" class="sr">区域の名前</label>
      <input type="text" id="drawName" placeholder="名前(例: 立田山鳥獣保護区)">
      <p class="note">境界の角を順に地図でタップします。最後の点は最初の点と自動でつながります。</p>
      <div class="addacts">
        <button class="btn ghost" id="drawCancel">やめる</button>
        <button class="btn" id="drawUndo">1つ戻す</button>
        <button class="btn primary" id="drawDone" disabled>登録する</button>
      </div>
    </div>

    <div class="toast" id="toast" role="status" hidden></div>
  </main>

  <section class="sheet" id="sheet" data-open="false">
    <button class="grip" id="grip" aria-label="パネルを開閉"><span></span></button>
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" data-v="track" aria-selected="true">山行</button>
      <button class="tab" role="tab" data-v="traps" aria-selected="false">罠 <b id="trapBadge"></b></button>
      <button class="tab" role="tab" data-v="records" aria-selected="false">記録</button>
      <button class="tab" role="tab" data-v="zones" aria-selected="false">区域</button>
      <button class="tab" role="tab" data-v="offline" aria-selected="false">保存</button>
    </div>
    <div class="view" id="view"></div>
  </section>
</div>

<dialog id="pinDialog">
  <form method="dialog" id="pinForm">
    <div class="dlg-head">
      <h2 id="pinTitle">地点を記録</h2>
      <span class="mono" id="pinMeta"></span>
    </div>
    <div><div class="label" id="pinTypesLabel">種類</div>
      <div class="types" id="pinTypes" role="radiogroup" aria-labelledby="pinTypesLabel"></div></div>
    <label for="pinAnimal">対象獣
      <select id="pinAnimal"><option>イノシシ</option><option>ニホンジカ</option><option>その他</option></select>
    </label>
    <label for="pinNote">メモ
      <textarea id="pinNote" rows="3" placeholder="例: ワイヤー12cm、獣道の踏み込み、泥が新しい"></textarea>
    </label>
    <div class="dlg-acts">
      <button type="button" class="btn ghost danger" id="pinDelete">削除</button>
      <span class="grow"></span>
      <button type="button" class="btn ghost" id="pinCancel">閉じる</button>
      <button type="submit" class="btn primary" id="pinSave">保存</button>
    </div>
  </form>
</dialog>

<input type="file" id="hmapFile" accept="image/*" multiple hidden>
<input type="file" id="zoneFile" accept=".geojson,.json,application/geo+json,application/json" hidden>

<dialog id="sheetDialog">
  <form method="dialog" id="sheetForm">
    <div class="dlg-head"><h2>どの地図ですか?</h2></div>
    <p class="note" id="sheetFile"></p>
    <label for="sheetPick">ハンターマップのページ
      <select id="sheetPick"></select>
    </label>
    <p class="note">選ぶと、画像の中の格子線(メッシュの線)を探して自動で位置を合わせます。熊本県の地図でなければ「手で合わせる」を選んでください。</p>
    <div class="dlg-acts"><span class="grow"></span>
      <button type="button" class="btn ghost" id="sheetCancel">取り込まない</button>
      <button type="submit" class="btn primary">決定</button>
    </div>
  </form>
</dialog>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
