<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>猟野ノート</title>
<meta http-equiv="refresh" content="0; url=../">
<style>body{font-family:system-ui,sans-serif;background:#eef0e6;color:#1f2a1f;padding:24px;line-height:1.7}a{color:#2b6cb0;font-weight:700}</style>
</head>
<body>
<p>B版は正式版になり、アドレスが変わりました。自動で移動します。</p>
<p><a href="../">猟野ノートを開く</a></p>
<p>ホーム画面に「猟野B」を追加していた場合は、それを削除して、新しいアドレスから追加し直してください。</p>
<script>
// 古いB版の仕組み(Service Worker)を片付けてから移動する。データは消さない
(async () => {
  try {
    const reg = await navigator.serviceWorker?.getRegistration('./');
    if (reg && reg.scope.endsWith('/b/')) await reg.unregister();
  } catch {}
  location.replace('../');
})();
</script>
</body>
</html>
